<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>liquid-glass meta image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&family=Outfit:wght@100..900&display=swap" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; color: #fff; font-family: 'Outfit', sans-serif; }

    /* The scene the glass bends: the same colours as the docs hero. */
    body {
      background:
        radial-gradient(circle at 18% 22%, #ff5f6d 0, transparent 36%),
        radial-gradient(circle at 84% 18%, #36d1dc 0, transparent 38%),
        radial-gradient(circle at 74% 92%, #f9d423 0, transparent 30%),
        #1d2671;
    }

    /* Sharp shapes behind the glass, so the distortion has something to bend. They stay at the edges. */
    .words { position: fixed; inset: 0; pointer-events: none; user-select: none; }
    .words span { position: absolute; font: 800 190px/1 'Outfit', sans-serif; letter-spacing: -0.04em; white-space: nowrap; color: rgba(255, 255, 255, 0.92); }
    .words span:nth-child(1) { top: -4px; left: -16px; }
    .words span:nth-child(2) { top: 214px; left: 40px; font-size: 200px; color: #111; }

    /* The content stays inside a centred safe area, for apps that crop the card. */
    main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .panel {
      display: flex; flex-direction: column; align-items: center; gap: 34px;
      padding: 52px 72px 48px;
      border-radius: 56px;
      background: rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin: 0;
      font: 600 132px/1 'EB Garamond', serif;
      text-shadow: 0 0 26px rgba(191, 206, 250, 0.8);
    }
    .badges { display: flex; gap: 18px; }
    .badge {
      padding: 14px 34px;
      border-radius: 999px;
      font-size: 30px;
      font-weight: 500;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
      background: rgba(255, 255, 255, 0.05);
    }
    .url { position: fixed; bottom: 36px; left: 0; right: 0; text-align: center; font-size: 24px; opacity: 0.6; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>
  <!-- The source for the Open Graph image, captured at 1200x630 (see docs/public/meta-image.jpg).
       Nothing links here, and it is not part of the built site. -->
  <div class="words" aria-hidden="true"><span>GLASS LENS</span><span>liquid glass</span></div>

  <main>
    <div class="panel" data-liquid-glass="12">
      <h1>liquid-glass</h1>
      <div class="badges">
        <div class="badge" data-liquid-glass="4">Backdrop blur</div>
        <div class="badge" data-liquid-glass="4">Edge distortion</div>
        <div class="badge" data-liquid-glass="4">Inner glow</div>
      </div>
    </div>
  </main>
  <p class="url">gabrielfins.github.io/liquid-glass</p>

  <script type="module" src="./meta-image.ts"></script>
</body>
</html>
